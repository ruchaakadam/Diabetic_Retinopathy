services:
  - type: web
    name: retinaai
    runtime: python
    plan: free

    buildCommand: ./build.sh
    startCommand: gunicorn --chdir web dr_web.wsgi:application --bind 0.0.0.0:$PORT

    envVars:
      - key: PYTHON_VERSION
        value: 3.12

      - key: DEBUG
        value: "False"

      - key: DJANGO_SECRET_KEY
        generateValue: true
